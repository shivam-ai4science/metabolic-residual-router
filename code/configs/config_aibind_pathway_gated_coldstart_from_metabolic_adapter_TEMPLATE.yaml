experiment:
  name: "aibind_pathway_gated_coldstart_from_metabolic_adapter"
  mode: "finetune"
  save_dir: "./runs"
  seed: 1234

finetune:
  source_run: "PASTE_METABOLIC_ADAPTER_RUN_FOLDER"
  checkpoint_type: "best"
  freeze_backbone: false

data:
  dataset_name: "BindingDB_AIBind"
  base_path: "../DPI/datasets"
  set_type: blind_start
  set_id: 4
  read_on_fly: false
  batch_size_train: 128
  batch_size_val: 256
  num_workers: 0
  embeddings: "coldstartcpi"
  max_lig_tokens: 101
  max_prot_tokens: 1001

model:
  name: "PathwayGatedColdstartCPI"
  params:
    latent_dim: 512
    num_heads: 4
    dropout: 0.1
    use_padding_mask: false
    output_dim: 2
    topk: 32
    gate_bias: -3.0
    freeze_base: true
    detach_base_features: true

loss:
  name: GatedResidualCrossEntropyLoss
  use_dynamic_weights: false
  params:
    label_smoothing: 0.0
    gate_l1_weight: 0.03
    correction_l1_weight: 0.03
    entropy_weight: 0.005
    distill_weight: 0.05
    distill_confidence: 0.9

trainer:
  seed: 1234
  max_epochs: 60
  learning_rate: 1e-4
  weight_decay: 1e-4
  optimizer: AdamW
  accumulation_steps: 1
  monitor_metric: val_score
  early_stopping_patience: 12
  save_every_n_epochs: 10

evaluation:
  test_after_fit: true
  export_predictions: true
