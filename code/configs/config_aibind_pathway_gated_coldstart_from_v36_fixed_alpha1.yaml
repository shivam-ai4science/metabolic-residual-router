experiment:
  name: "aibind_pathway_gated_coldstart_from_v36_fixed_alpha1"
  mode: "finetune"
  save_dir: "./runs"
  seed: 1234

finetune:
  source_run: "metabolic_pathway_gated_coldstart_adapter_random_pair_v36_pu_rank_20260730_140013"
  checkpoint_type: "best"
  freeze_backbone: false

data:
  dataset_name: "BindingDB_AIBind"
  base_path: "../DPI/datasets"
  set_type: blind_start
  set_id: 4
  read_on_fly: false
  batch_size_train: 256
  batch_size_val: 256
  num_workers: 0
  embeddings: "coldstartcpi"
  max_lig_tokens: 101
  max_prot_tokens: 1001

model:
  name: "PathwayGatedColdstartCPI"
  params:
    latent_dim: 512
    num_heads: 4
    dropout: 0.1
    use_padding_mask: false
    output_dim: 2
    topk: 32
    gate_bias: -1.5
    max_gate: 0.50
    max_delta: 4.0
    delta_init_std: 0.0
    freeze_base: true
    detach_base_features: true
    freeze_pathway_adapter: true
    train_correction_scale: true
    correction_scale_init: 1.0
    correction_scale_max: 2.0
    use_base_uncertainty_gate: false

loss:
  name: GatedResidualCrossEntropyLoss
  use_dynamic_weights: false
  params:
    label_smoothing: 0.0
    gate_l1_weight: 0.0
    delta_l2_weight: 0.0
    correction_l1_weight: 0.0
    negative_positive_correction_weight: 0.0
    positive_negative_correction_weight: 0.0
    entropy_weight: 0.0
    distill_weight: 0.0

trainer:
  seed: 1234
  max_epochs: 1
  learning_rate: 0.0
  weight_decay: 0.0
  optimizer: Adam
  accumulation_steps: 1
  monitor_metric: val_score
  monitor_mode: max
  early_stopping_patience: 1
  save_every_n_epochs: 0

evaluation:
  test_after_fit: true
  export_predictions: true
